name: Create Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: write
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: gitduppy-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact_name: gitduppy-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact_name: gitduppy-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact_name: gitduppy-darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: gitduppy-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=${{ github.event.release.tag_name }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ${{ matrix.artifact_name }} ./cmd/server

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-checksums:
    permissions:
      contents: write
    name: Create Checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all release assets
        run: |
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "gitduppy-*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Generate SHA256 checksums
        run: |
          sha256sum * > gitduppy-checksums.txt
          cat gitduppy-checksums.txt

      - name: Upload checksums to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: gitduppy-checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
