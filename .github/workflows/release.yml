name: Create Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: gitduppy-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact_name: gitduppy-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact_name: gitduppy-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact_name: gitduppy-darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: gitduppy-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.event.release.tag_name }}
          BUILD_TIME: ${{ github.event.release.created_at }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION -X main.BuildTime=$BUILD_TIME" \
            -o ${{ matrix.artifact_name }} ./cmd/server

      - name: Upload release asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-checksums:
    name: Create Checksums
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        run: |
          gh release download ${{ github.event.release.tag_name }} --pattern "gitduppy-*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        run: |
          sha256sum * > gitduppy-checksums.txt
          cat gitduppy-checksums.txt

      - name: Upload checksums to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: gitduppy-checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
